<body>

      text-align: center;

   <h1> <strong>palce your order </strong></h1>
<form style= "border:3px solid black; width:300px; padding:20px">
   <label>Customer Name:</label>
        <input type="text" placeholder="Enter your name"><br>
        <label>Phone Number:</label>
        <input type="tel" placeholder="Enter phone number"><br>
        <label>Flower Type:</label>

            <option>Jasmine</option>
            <option>Mixed Flowers</option>
        </select><br>
        <label>Occasion:</label>
        <select>

            <option>Wedding</option>
            <option>Anniversary</option>
            <option>Festival</option>
        </select><br>
        <label>Delivery Address:</label><br>
        <textarea rows="3" placeholder="Enter delivery address"></textarea><br>
        <label>Delivery need on(Date):</label>
         <input type="date">
         <label>Delivery Time:</label><br>
         <input type="time"><br>
          <button><a href="D:\sem 2\vshtml/order.png">place order</a></button>
</form>
